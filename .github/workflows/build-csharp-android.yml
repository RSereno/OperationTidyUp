name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: tidyup
  # Folder that contains project.godot (use "." if it is at the repo root)
  PROJECT_PATH: .
  # Must match the preset name in export_presets.cfg exactly (case-sensitive)
  PRESET_NAME: Android

jobs:
  export-android:
    name: Export Android APK (Godot 4.7.2 Mono)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Import resources
        run: |
          cd "$PROJECT_PATH"
          godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "$PRESET_NAME" "$EXPORT_DIR/android/$EXPORT_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export-android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidyup-android-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: tidyup.apk