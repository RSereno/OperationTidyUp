name: Build Godot C# Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Adjust if using Godot 4.0-4.2 (.NET 6)

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Use a modern command-line tools version to prevent the xml version 3/4 error
          cmdline-tools-version: "11076708" 

      - name: Godot Android Export (.NET)
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: '4.3'
          godot-channel: 'stable'