name: Build Godot C# Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"        # Change to your exact Godot version (e.g., 4.3, 4.4)
  EXPORT_PRESET: "Android"    # Must match the exact preset name in export_presets.cfg
  APK_NAME: "OperationTidyUp.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Use '8.0' for Godot 4.3+, or '6.0' for Godot 4.0-4.2

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Download Godot (.NET) & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot
          mv Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/GodotSharp /usr/local/bin/GodotSharp
          chmod +x /usr/local/bin/godot

          # Create template directory and extract export templates
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mv templates/* "$TEMPLATE_DIR/"

          # 🚀 CRITICAL FIX: Dynamically inject the required Godot library binaries into the ignored libs folder
          mkdir -p android/build/libs
          cp "$TEMPLATE_DIR/godot-lib.template_debug.aar" android/build/libs/
          cp "$TEMPLATE_DIR/godot-lib.template_release.aar" android/build/libs/

      - name: Import Assets & Build C# Solution
        run: |
          godot --headless --import --quit
          dotnet build

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "${EXPORT_PRESET}" "build/android/${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/android/${APK_NAME}