name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: tidyup
  # Folder that contains project.godot (use "." if it is at the repo root)
  PROJECT_PATH: .
  # Must match the preset name in export_presets.cfg exactly (case-sensitive)
  PRESET_NAME: Android

jobs:
  export-android:
    name: Export Android APK (Godot 4.7.2 Mono)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.7.2
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      # C# on Android requires the Gradle build template (normally installed
      # from the editor's Project menu) and use_gradle_build=true in the preset.
      - name: Install Android build template
        run: |
          command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)
          cd "$PROJECT_PATH"
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable.mono" > android/.build_version
          touch android/build/.gdignore
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg || true

      # The container's HOME is /github/home, so the image's pre-made editor
      # settings are not picked up. Write the Android SDK/JDK settings explicitly.
      # (The release keystore is NOT configured here; see the export step.)
      - name: Configure Godot editor settings for Android
        run: |
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres

      # Decode the Base64 keystore secret back into a physical .jks file
      - name: Decode release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release-key.jks
          test -s /tmp/release-key.jks || (echo "Keystore secret is empty or invalid" && exit 1)
          keytool -list -keystore /tmp/release-key.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" | head -n 5

      - name: Import resources
        run: |
          cd "$PROJECT_PATH"
          godot --headless --import || true

      # Godot reads the release keystore from these environment variables
      # (they override the keystore fields in the export preset).
      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release-key.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "$PRESET_NAME" "$EXPORT_DIR/android/$EXPORT_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXPORT_NAME }}-android-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export-android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tidyup-android-apk
      - uses: softprops/action-gh-release@v3
        with:
          files: tidyup.apk